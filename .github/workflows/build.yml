name: Build gpkg

on:
  push:
    branches:
    - main
    paths:
    - 'gpkg/**'
  pull_request:
    paths:
    - 'gpkg/**'
  workflow_dispatch:
    inputs:
      packages:
        description: "A space-separated list of packages to build (e.g. 'bash glibc coreutils')"
        required: true
      force-build-deps:
        description: "Build all dependencies from source instead of using cached debs (needed for first-time libtool/.la bootstrapping)"
        type: boolean
        default: false
      publish:
        description: "Publish built packages to the live apt repo (GitHub Pages)"
        type: boolean
        default: false

permissions: {} # none

jobs:
  build:
    permissions:
      contents: read # actions/upload-artifact doesn't need contents: write
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_arch: [aarch64, arm, i686, x86_64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 1000

    - name: Set up QEMU
      run: |
        while true; do
          {
            sudo apt update
            yes | sudo apt install qemu-user qemu-user-static binfmt-support
          } || continue
          break
        done
        sudo update-binfmts --enable qemu-aarch64
        sudo update-binfmts --enable qemu-arm
        docker run --rm --privileged tonistiigi/binfmt --install all

    - name: Get files from termux-packages repository
      run: ./get-build-package.sh

    - name: Gather build summary
      run: |
        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          BASE_COMMIT=$(jq --raw-output .pull_request.base.sha "$GITHUB_EVENT_PATH")
          OLD_COMMIT=$(jq --raw-output .commits[0].id "$GITHUB_EVENT_PATH")
          HEAD_COMMIT=$(jq --raw-output .commits[-1].id "$GITHUB_EVENT_PATH")
          if [ "$BASE_COMMIT" = "null" ]; then
            if [ "$OLD_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "Processing commit: ${HEAD_COMMIT}"
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${HEAD_COMMIT}")
            else
              OLD_COMMIT="${OLD_COMMIT}~1"
              echo "Processing commit range: ${OLD_COMMIT}..${HEAD_COMMIT}"
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${OLD_COMMIT}" "${HEAD_COMMIT}")
            fi
          else
            echo "Processing pull request #$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH"): ${BASE_COMMIT}..HEAD"
            CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r "${BASE_COMMIT}" "HEAD")
          fi
        fi
        mkdir -p ./artifacts ./debs
        touch ./debs/.placeholder

        if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
          if grep -qiP '^\s*%ci:no-build\s*$' <(git log --format="%B" -n 1 "HEAD"); then
            tar cf artifacts/debs-${{ matrix.target_arch }}.tar debs
            echo "[!] Force exiting as tag '%ci:no-build' was applied to HEAD commit message."
            exit 0
          fi

          if grep -qP '^scripts/(Dockerfile|properties\.sh|setup-android-sdk\.sh|setup-cgct\.sh|setup-ubuntu\.sh)$' <<< "$CHANGED_FILES"; then
            echo "Detected changes for environment setup scripts. Building custom Docker image now."
            docker build -t ghcr.io/termux/package-builder-cgct:latest .
          fi

          for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
            repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
            while read -r file; do
              if ! [[ $file == ${repo_path}/* ]]; then
                continue
              fi
              if [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/([.a-z0-9+-]*).subpackage.sh$ ]]; then
                pkg=${BASH_REMATCH[1]}
                subpkg=${BASH_REMATCH[2]}
                if [ ! -f "${repo_path}/${pkg}/${subpkg}.subpackage.sh" ]; then
                  echo "$subpkg" >> ./deleted_${repo}_packages.txt
                fi
              elif [[ $file =~ ^${repo_path}/([.a-z0-9+-]*)/.*$ ]]; then
                pkg=${BASH_REMATCH[1]}
                if [ -d "${repo_path}/${pkg}" ]; then
                  echo "$pkg" >> ./built_${repo}_packages.txt
                  for file in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                    echo "$(basename "${file%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                  done
                else
                  echo "$pkg" >> ./deleted_${repo}_packages
                fi
              fi
            done<<<${CHANGED_FILES}
          done
        else
          # MANUAL_INPUT_PACKAGES may contain newlines from multiline workflow inputs.
          MANUAL_INPUT_PACKAGES="${{ github.event.inputs.packages }}"
          read -a PACKAGES <<< "${MANUAL_INPUT_PACKAGES//$'\n'/ }"
          for pkg in "${PACKAGES[@]}"; do
            repo_paths=$(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json)
            found=false
            for repo_path in $repo_paths; do
              repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
              if [ -d "${repo_path}/${pkg}" ]; then
                found=true
                echo "$pkg" >> ./built_${repo}_packages.txt
                for subpkg in $(find "${repo_path}/${pkg}/" -maxdepth 1 -type f -name \*.subpackage.sh | sort); do
                  echo "$(basename "${subpkg%%.subpackage.sh}")" >> ./built_${repo}_subpackages.txt
                done
              fi
            done
            if [ "$found" != true ]; then
              echo "Package '${pkg}' not found in any of the repo"
              exit 1
            fi
          done
        fi

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          if [ -f ./built_${repo}_packages.txt ]; then
            sort ./built_${repo}_packages.txt | uniq > ./built_${repo}_packages.txt.tmp
            mv ./built_${repo}_packages.txt.tmp ./built_${repo}_packages.txt
          fi
          if [ -f ./built_${repo}_subpackages.txt ]; then
            sort ./built_${repo}_subpackages.txt | uniq > ./built_${repo}_subpackages.txt.tmp
            mv ./built_${repo}_subpackages.txt.tmp ./built_${repo}_subpackages.txt
          fi
          if [ -f ./deleted_${repo}_packages.txt ]; then
            sort ./deleted_${repo}_packages.txt | uniq > ./deleted_${repo}_packages.txt.tmp
            mv ./deleted_${repo}_packages.txt.tmp ./deleted_${repo}_packages.txt
          fi
        done

    - name: Lint packages
      run: |
        declare -a package_recipes
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)
          if [ -f ./built_${repo}_packages.txt ]; then
            package_recipes="$package_recipes $(cat ./built_${repo}_packages.txt | repo_path=${repo_path} awk '{print ENVIRON["repo_path"]"/"$1"/build.sh"}')"
          fi
        done

        if [ ! -z "$package_recipes" ]; then
          ./scripts/lint-packages.sh $package_recipes
        fi

    - name: Build packages
      run: |
        declare -a packages
        for repo_path in $(jq --raw-output 'del(.pkg_format) | keys | .[]' repo.json); do
          repo=$(jq --raw-output '.["'${repo_path}'"].name' repo.json)

          if [ -f ./built_${repo}_packages.txt ]; then
            packages="$packages $(cat ./built_${repo}_packages.txt)"
          fi
        done

        if [ ! -z "$packages" ]; then
          # Optional: build all dependencies from source (needed for first-time
          # .la/libtool bootstrapping, e.g. when -static subpkgs split .la files
          # but the resolver only extracts main debs which lack them).
          force_build_deps=""
          if [ "${{ github.event.inputs.force-build-deps }}" = "true" ]; then
            force_build_deps="-F"
          fi

          if grep -qP "(^|\s)${packages// /($|\s)|(^|\s)}($|\s)" ./big-pkgs.list; then
            ./scripts/setup-ubuntu.sh
            ./scripts/setup-cgct.sh
            sudo apt install ninja-build
            sudo apt purge -yq $(dpkg -l | grep '^ii' | awk '{ print $2 }' | grep -P '(aspnetcore|cabal-|dotnet-|ghc-|libmono|php)') \
              firefox google-chrome-stable microsoft-edge-stable mono-runtime-common monodoc-manual ruby
            sudo apt autoremove -yq
            sudo rm -fr /opt/hostedtoolcache /usr/share/dotnet /usr/share/swift
            NDK=$ANDROID_NDK_LATEST_HOME ANDROID_HOME=$ANDROID_SDK_ROOT ./build-package.sh $force_build_deps -I -a ${{ matrix.target_arch }} --library glibc $packages
          else
            # cgct toolchain in the builder-cgct image lives under com.termux
            # paths (the image is the upstream one, built with CGCT_DIR set to
            # /data/data/com.termux/cgct). Override CGCT_DIR via termuxrc.sh
            # (sourced by properties.sh) so the glibc build finds it, symlink
            # the glibc prefix so the fork's app path maps to it, and import
            # the fork repo signing key so gpg can verify the fork's released
            # repo metadata during dependency resolution (-I).
            TERMUX_BUILDER_IMAGE_NAME="ghcr.io/termux/package-builder-cgct" ./scripts/run-docker.sh bash -c 'mkdir -p "$HOME/.termux" "$HOME/.gnupg" && chmod 700 "$HOME/.gnupg" && printf "CGCT_DIR=/data/data/com.termux/cgct\n" > "$HOME/.termux/termuxrc.sh" && gpg --batch --import apexstudio-packages.asc && mkdir -p /data/data/dev.apexstudio.ide/files/usr && ln -sfn /data/data/dev.apexstudio.ide/files/usr/glibc /data/data/com.termux/files/usr/glibc'
            TERMUX_BUILDER_IMAGE_NAME="ghcr.io/termux/package-builder-cgct" ./scripts/run-docker.sh ./build-package.sh $force_build_deps -I -a ${{ matrix.target_arch }} --library glibc $packages
          fi
        fi

    - name: Generate build artifacts
      if: always()
      run: |
        test -d termux-packages/output && mv termux-packages/output/* ./output/

        for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
          test -f ./built_${repo}_packages.txt && mv ./built_${repo}_packages.txt ./debs/
          test -f ./built_${repo}_subpackages.txt && cat ./built_${repo}_subpackages.txt >> ./debs/built_${repo}_packages.txt \
            && rm ./built_${repo}_subpackages.txt
          test -f ./deleted_${repo}_packages.txt && mv ./deleted_${repo}_packages.txt ./debs/

          if [ -f "./debs/built_${repo}_packages.txt" ] && [ -d "output" ]; then
            while read -r pkg; do
              # NOTE: braces around ${pkg} are required — "$pkg_*.deb" parses as
              # the empty variable 'pkg_', degrading to '*.deb' and moving every
              # deb out of output/ before the leftover block can process them.
              find output \( -name "${pkg}_*.deb" -o -name "${pkg}-static_*.deb" \) -type f -print0 | xargs -0r mv -t debs/
            done < <(cat "./debs/built_${repo}_packages.txt")
          fi
        done

        if [ -d "output" ]; then
          mapfile -d '' -t leftover_debs < <(find output -name '*.deb' -type f -print0)
          for deb in "${leftover_debs[@]}"; do
            mv "$deb" debs/
            pkg="$(basename "$deb")"
            pkg="${pkg%%_*}"
            for repo in $(jq --raw-output 'del(.pkg_format) | .[].name' repo.json); do
              if [ -f "./debs/built_${repo}_packages.txt" ]; then
                echo "$pkg" >> "./debs/built_${repo}_packages.txt"
              fi
            done
          done
          rmdir output 2>/dev/null || true
        fi

        tar cf artifacts/debs-${{ matrix.target_arch }}-${{ github.sha }}.tar debs
    - name: Checksums for built *.deb files
      if: always()
      run: |
        find debs -type f -name "*.deb" -exec sha256sum "{}" \; | sort -k2
    - name: Store *.deb files
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: debs-${{ matrix.target_arch }}-${{ github.sha }}
        path: ./artifacts

  upload:
    concurrency: ${{ github.workflow }}
    permissions:
      contents: write
    if: github.event_name != 'pull_request' && github.event.inputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Get files from termux-packages repository
      run: ./get-build-package.sh
    - name: Get *.deb files
      uses: actions/download-artifact@v8.0.1
      with:
        path: ./
    - name: Extract *.deb archives
      run: |
        for archive in debs-*/debs-{aarch64,arm,i686,x86_64}-${{ github.sha }}.tar; do
          tar xf "$archive"
        done
    - name: Import GPG signing key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.APEX_GPG_PRIVATE_KEY }}
        GNUPGHOME: ${{ runner.temp }}/gnupg
      run: |
        if [ -z "$GPG_PRIVATE_KEY" ]; then
          echo "::error::Missing APEX_GPG_PRIVATE_KEY secret; repository will be unsigned"
          exit 0
        fi
        mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
        export GNUPGHOME
        printf '%s' "$GPG_PRIVATE_KEY" > /tmp/private.asc
        gpg --batch --yes --import /tmp/private.asc
        rm -f /tmp/private.asc
    - name: Get current gh-pages tree
      run: |
        git fetch --depth 1 origin gh-pages || true
        if git rev-parse --verify FETCH_HEAD >/dev/null 2>&1; then
          git worktree add -q gh-pages FETCH_HEAD
        else
          git worktree add -q --orphan gh-pages gh-pages
          git -C gh-pages rm -rfq . 2>/dev/null || true
        fi
    - name: Publish apt repository
      env:
        GNUPGHOME: ${{ runner.temp }}/gnupg
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
        export GNUPGHOME
        if gpg --batch --list-secret-keys >/dev/null 2>&1; then
          GPG_KEY=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr/{print $10; exit}')
        else
          GPG_KEY=""
        fi
        bash scripts/publish-gh-pages.sh \
          --pages gh-pages \
          --debs "$PWD/debs" \
          --gpg-key "$GPG_KEY" \
          --public-key "$PWD/apexstudio-packages.asc" \
          --repo-root "$PWD" \
          --github-repo "${GITHUB_REPOSITORY}"
    - name: Push to gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd gh-pages
        rm -rf .merge-*
        if git diff --quiet && git diff --cached --quiet; then
          echo "No repository changes; skipping push"
          exit 0
        fi
        git add -A
        git -c user.name='ApexStudio CI' -c user.email='ci@apexstudio.dev' \
          commit -q -m "Update apt repository [skip ci]"
        git push -q origin gh-pages
